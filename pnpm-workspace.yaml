ignoreWorkspaceRootCheck: true
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - apps/*
  - packages/*

# Security floors for transitive dependencies. Review with `pnpm audit --fix`
# and drop entries once the parent packages adopt patched versions.
overrides:
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  micromark-extension-math>katex: 0.18.2

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  simple-git-hooks: true
